[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-code-editor"
version = "1.0.0"
description = "轻量级跨平台 SSH 远程代码编辑器（本地 GUI + SSH/SFTP，远端零常驻服务）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.5",
    "paramiko>=2.9",
    "Pygments>=2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.2",
    "pyinstaller>=6.0",
]

[project.gui-scripts]
remote-code-editor = "app.main:main"

[project.urls]
Homepage = "https://example.invalid/remote-code-editor"

[tool.setuptools]
packages = ["app", "app.ui", "app.ui.widgets", "app.editor", "app.remote", "app.git", "app.config", "app.cache", "app.utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 说明：本机若安装了 ROS 的 launch_testing / launch_ros 插件，它们与新版 pytest 不兼容，
# 这里显式关闭；在未安装这些插件的机器上，下列参数是无害的空操作。
addopts = "-p no:launch_ros -p no:launch_testing"
qt_api = "pyside6"

[tool.pyinstaller]
# 打包参数见 scripts/build_windows.bat 与 scripts/build_linux.sh
